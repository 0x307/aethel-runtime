[package]
name = "aethel-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Delegated authority for post-quantum identities: login handshake, sessions, delegation, succession and revocation statements over aethel-core's ML-DSA-65 identities. Verifier-first: the default build is verification only and depends on aethel-core alone."
authors = ["Ed Johnson"]
license = "Apache-2.0"
repository = "https://github.com/0x307/aethel-runtime"
keywords = ["identity", "post-quantum", "authentication", "delegation", "session"]
categories = ["cryptography", "authentication"]

# Plain rlib, deliberately. A server-side verifier has no use for a cdylib,
# and a cdylib is what stopped `erand-nats` publishing on Linux. The sibling
# `aethel-vault` needs cdylib for its wasm target; this crate does not.
[lib]
crate-type = ["rlib"]

# ── Features ──────────────────────────────────────────────────────────────────
#
# Verifier-first. The default build is what a relying party runs: it verifies
# statements and holds no secret of any kind. Producing statements is the
# holder's side of the protocol and is opt-in, because a server should never
# link the machinery for it by accident.
[features]
default = ["std", "verify", "serde"]

std = []

# `verify` — check a login response, a session, a delegation, a succession or
# a revocation statement. Public material only. This is the surface a service
# hosts, and it must never grow a dependency that implies holding a secret.
verify = []

# `serde` — derive Serialize/Deserialize on every statement type.
#
# On by default because a statement that cannot cross a wire is not much use:
# the holder signs in one process and the verifier checks in another, so some
# encoding always exists. Better one in the crate both ends share than two
# hand-rolled ones that agree until they do not.
#
# JSON is not the canonical form. `signing_input` is, and it is
# length-prefixed and independent of this. serde moves the struct; the
# signature covers the canonical bytes either way.
serde = ["dep:serde"]

# `holder` — produce those statements rather than check them.
#
# Adds no dependency: signing needs `aethel_core::signing::Identity`, which is
# already here. The gate is not about cost, it is a guardrail — a server that
# reaches for a builder is doing something it should not, and this makes that
# a compile error rather than a code review.
holder = []

[dependencies]
# `default-features = false` plus `std` keeps the component and enclave
# machinery out: this crate needs the signing and verification surface,
# nothing else.
aethel-core = { version = "0.7", default-features = false, features = ["std"] }

# SHAKE-256, for the session-secret commitment and the stored token hash. The
# same hash and the same version aethel-core itself uses, so this adds no new
# algorithm to the trust surface.
#
# The session MAC is deliberately *not* on this hash, and once was. It moved
# to HMAC-SHA-256 under D8 because the browser computes it on WebCrypto, which
# offers no SHA-3. These two stay on SHAKE because both are computed only
# server-side, where that constraint does not reach.
sha3 = { version = "0.10", default-features = false }

# Constant-time equality for the MAC and the stored token hash. Comparing
# either with `==` leaks how many leading bytes matched, and a hand-rolled
# loop is liable to be optimised back into an early return. `subtle` exists
# to stop exactly that and is the ecosystem's standard answer.
subtle = { version = "2.6", default-features = false }

# HMAC-SHA-256 for the session MAC. Not SHAKE, despite SHAKE being this
# family's house hash, and the reason is a hard platform constraint rather
# than a preference: the browser holds the session key as a non-extractable
# WebCrypto key, WebCrypto offers HMAC over SHA-2 only, and it has no SHA-3 or
# SHAKE. Computing the MAC in JavaScript instead would mean JavaScript holding
# the raw key, which is what the non-extractable key exists to prevent.
#
# Symmetric either way, so this stays all-PQC: Grover costs a square root and
# leaves 128 bits on a 256-bit key.
#
# `sha2` additionally hashes the request body for the canonical binding, for
# the same reason: the browser has to compute that hash too.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
# Only to read the browser client's output in the cross-language test. Not a
# runtime dependency: the canonical encoding is length-prefixed bytes, and
# nothing this crate verifies is JSON.
serde_json = "1.0"

# Benchmarks. In `benches/`, run by `cargo bench`, with a baseline and a
# statistical model. `default-features = false` drops the plotting stack.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "authority"
harness = false
# Verifying a statement means having one, and building one is the holder's
# job. Declared here rather than skipped at runtime, so benching without the
# feature fails to select the target instead of measuring a subset and
# reporting success.
required-features = ["holder"]

[[test]]
name = "holder_roundtrip"
path = "tests/holder_roundtrip.rs"
required-features = ["holder"]

[[test]]
name = "directory"
path = "tests/directory.rs"
required-features = ["holder"]
