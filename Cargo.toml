[package]
name = "aethel-vault"
version = "0.3.3"
edition = "2021"
rust-version = "1.87"
description = "Post-quantum wallet vault for Rust and WASM. Thin `signer` mode (default) authorizes EIP-3009/x402 USDC transfers under a caller-supplied ECDSA-capable `SettlementSigner` and signs the intent with ML-DSA-65; confidential internal balances (`fhe-state` feature) are held and transferred as ciphertext the vault never decrypts. Vault IDs derive from aethel-core anonymous identities."
authors = ["K. Harper et al. <aytch4k@aethel.network>"]
license = "Apache-2.0"
repository = "https://github.com/0x307/aethel-runtime"
homepage = "https://0x307.com/crates"
documentation = "https://docs.rs/aethel-vault"
keywords = ["wallet", "post-quantum", "wasm", "eip3009", "identity"]
categories = ["cryptography", "wasm"]

# Not required by a Rust consumer (they build from src/), and both carry a
# stronger permanence bar once published: dist/ includes a compiled .wasm
# binary that goes stale the moment src/ changes (it predates this crate's
# identity-coupling work entirely), and the two spec docs still describe
# unimplemented target architecture (SRAM PUF, an "enclave binary" build)
# under a caveat rather than stripped, which is a different bar than what's
# acceptable to caveat-and-keep in the mutable git repo. Both stay in the
# git repo for GitHub readers; neither ships in the published crate.
exclude = [
    "dist/",
    "docs/TFHE-VAULT-SPEC.md",
    "docs/WASM-DEPLOYMENT.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

# ── Features ──────────────────────────────────────────────────────────────────
#
# SAGP-PG-001 V-3: thin `signer` mode is the default. A consumer who only
# wants to sign an EIP-3009/x402 authorization (the Wave-1 unattended-pay
# path) must not pay for `tfhe`, `tokio`, `tonic`, or `prost` — none of those
# are reachable from `default`. See `docs/TFHE-VAULT-SPEC.md`'s custody
# section and `README.md`'s "Two modes" table.

[features]
# Default: thin signer mode. No FHE, no HelixDB gRPC stack.
default = ["std", "signer"]

# Standard library support. Does NOT pull tokio/tonic/prost (that is
# `helixdb`'s job) or tfhe (that is `fhe-state`'s job).
std = ["serde/std"]

# `signer` — EIP-3009/x402 export (V-1), spend policy (V-4), and signed
# receipts (V-5). No `tfhe`, no HelixDB. This is "the vault as signer of a
# normal USDC wallet" the gap analysis calls the #1 utility feature.
signer = []

# `fhe-state` — the confidential-internal-balance ledger (`vault.rs`'s
# `VaultState`/homomorphic transfer state machine) and `client.rs`'s
# `NativeVaultClient`. Optional: FHE mode is a differentiator for agents that
# store state on a hostile host, not a Wave-1 gate (SAGP-PG-001 §7.4).
fhe-state = ["dep:tfhe"]

# `helixdb` — the HelixDB gRPC storage adapter (`storage::helixdb`). Pulls
# `tokio`, `tonic`, `prost`, and runs `prost-build` in `build.rs`.
helixdb = ["std", "dep:tokio", "dep:tonic", "dep:prost"]

# WASM-specific features: wasm-bindgen exports.
# wasm-bindgen itself provides the global allocator and panic handler for
# wasm32-unknown-unknown; aethel-core has no wasm feature of its own to
# enable (its only WebAssembly surface is the WIT component, gated behind
# its own `component` feature, which this crate does not use).
wasm = [
    "dep:wasm-bindgen",
    "dep:zeroize",
]

# `hosted` — DOES NOT EXIST AS A REAL FEATURE. Naming it is a hard
# compile-time error (see `src/vault.rs`): aethel-vault refuses a
# "hosted vault" mode structurally, not just by convention. The ServerKey
# (in `fhe-state` mode) and the settlement signer (in `signer` mode) never
# leave the agent — see the "Custody rule" section of `README.md` and
# `docs/TFHE-VAULT-SPEC.md` (SAGP-PG-001 V-2).
hosted = []

# ── Core Dependencies (all targets) ──────────────────────────────────────────

[dependencies]

# Binary serialization — no_std compatible (default-features = false)
bincode = { version = "1.3", default-features = false }

# Serialization framework — no_std compatible with alloc feature
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

# SHA3 / SHAKE-256 for vault ID derivation, Keccak256 for EIP-712/EIP-191
# digests (V-1). This crate never adds `k256`/`secp256k1`/`alloy`/`ethers` —
# see `src/settlement.rs`'s module docs and
# `tests/settlement_tests.rs::manifest_contains_no_ecdsa_crates` for why.
sha3 = { version = "0.10", default-features = false }

# Secure memory zeroization
zeroize = { version = "1.7", features = ["zeroize_derive"], optional = true }

# ── aethel-core — PLP vault ID derivation, identity verification, and the
# ML-DSA-65 `signing::Identity` this crate's own (non-settlement) signatures
# use: spend intents, settlement receipts, wallet-bind attestations, and
# HITL approvals (V-1/V-4/V-5), all under the purpose-separated contexts in
# `aethel_core::signing::purpose`. ──────────────────────────────────────────
#
# 0.6 is the first release with the A-4 wire/verify_projection surface and
# the `signing::purpose` registry this crate's `settlement`/`policy`/`receipt`
# modules consume. 0.7 is the current release: `Identity` appears in this
# crate's public API, so an application that also depends on aethel-core
# directly must use the same minor version. Resolved from crates.io, so CI and a `cargo publish`
# build against the same published artifact.
#
# The floor is 0.7.5, the release that moves aethel-core to pqc-sig 0.5 with
# byte-identical outputs. An app that asks for aethel-core "0.7.4" still
# builds: cargo picks 0.7.5 for both. An app on pqc-sig 0.4 still builds:
# pqc-sig 0.4 and 0.5 resolve side by side, and no pqc-sig type is in either
# crate's public API. An exact `=0.7.4` pin stays on aethel-vault 0.3.2.
#
# default-features = false: don't pull in aethel-core's std feature; its
# `plp`/`credential`/`signing`/`wire` modules are no_std + alloc, matching
# this crate's own no_std-style module bodies.
[dependencies.aethel-core]
version = "0.7.5"
default-features = false
optional = false

# Version floor only. This crate never uses ctutils directly. aethel-core
# reaches it through pqc-sig's ML-DSA (ml-dsa, hybrid-array, digest), on every
# build, and ctutils < 0.4.4 has RUSTSEC-2026-0385 (non-constant-time mask
# generation and u128 comparisons). Naming it here stops any resolver,
# including the MSRV-aware fallback, from choosing an affected version. 0.4.4
# needs Rust 1.87, which sets this crate's rust-version. Same floor as pqc-sig
# 0.5.1.
[dependencies.ctutils]
version = "0.4.4"
default-features = false

# ── WASM-bindgen (optional) ───────────────────────────────────────────────────
[dependencies.wasm-bindgen]
version = "0.2"
optional = true

# ── Native-only dependencies (non-wasm32 target) ──────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Async runtime for gRPC — only reachable via the `helixdb` feature.
tokio = { version = "1", features = ["full"], optional = true }
# gRPC framework — only reachable via the `helixdb` feature.
tonic = { version = "0.11", optional = true }
# Protocol Buffers — only reachable via the `helixdb` feature.
prost = { version = "0.12", optional = true }

# TFHE for native builds — only reachable via the `fhe-state` feature.
# `boolean`/`shortint`/`integer` alone are not enough: `generate_keys` needs
# a hardware randomness seeder, which is a separate opt-in feature bundle
# per architecture, and panics at runtime ("Unable to instantiate a seeder")
# without one. This went unnoticed because no test that would have called
# it was ever unignored — see tests/vault_tests.rs.
[target.'cfg(all(not(target_arch = "wasm32"), target_arch = "x86_64"))'.dependencies]
tfhe = { version = "0.7", features = ["boolean", "shortint", "integer", "x86_64"], optional = true }

[target.'cfg(all(target_arch = "aarch64", unix))'.dependencies]
tfhe = { version = "0.7", features = ["boolean", "shortint", "integer", "aarch64-unix"], optional = true }

# ── WASM-only dependencies ────────────────────────────────────────────────────
# NOTE: The vault contract WASM binary does NOT link tfhe directly.
# The wasmer.io host environment provides TFHE operations via host imports.
# The WASM binary is a pure state machine that stores/retrieves serialized
# ciphertext bytes — all homomorphic operations are delegated to the host.
# This keeps the WASM binary small and avoids the tfhe WASM compilation issues.

# ── Build Dependencies ────────────────────────────────────────────────────────

[build-dependencies]
# prost-build: Generate Rust types from proto3 definitions (native only).
# `build.rs` only invokes this when the `helixdb` feature is enabled
# (checked via the `CARGO_FEATURE_HELIXDB` env var Cargo sets), so a thin
# `signer`-mode build does not require a `protoc` install.
prost-build = { version = "0.12" }

# ── Dev Dependencies ──────────────────────────────────────────────────────────

[dev-dependencies]
# Test utilities for the `fhe-state` test paths in tests/vault_tests.rs.
tokio = { version = "1", features = ["full"] }
tfhe = { version = "0.7", features = ["boolean", "shortint", "integer"] }

# ── Release Profile (WASM Size Optimization) ──────────────────────────────────

# tfhe's key generation and homomorphic operations are unusably slow when
# compiled unoptimized: on the plain dev profile the three real vault tests
# spend many minutes inside tfhe before the first assertion runs, which is why
# `cargo test` looked like it hung. Optimizing dependencies while leaving this
# crate itself unoptimized keeps the tests debuggable and lets the suite finish.
# Profile settings only apply when this crate is the workspace root, so a
# downstream consumer's build is unaffected.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"          # Optimizes for binary size (most aggressive)
lto = true               # Deep cross-crate Link Time Optimization
codegen-units = 1        # Maximize LTO optimization scope
panic = "abort"          # Removes unwinding tables (saves ~150-300KB)
strip = true             # Strips debug symbols and symbol tables
overflow-checks = false  # Drops runtime integer overflow checks in release

# ── WASM-Specific Profile ─────────────────────────────────────────────────────

[profile.wasm-release]
inherits = "release"
opt-level = "s"          # Balanced size/speed for client SDK
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
